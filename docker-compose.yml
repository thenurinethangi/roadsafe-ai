services:
  db:
    image: postgres:16
    container_name: roadsafe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: roadsafe
      POSTGRES_PASSWORD: roadsafe
      POSTGRES_DB: roadsafe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
